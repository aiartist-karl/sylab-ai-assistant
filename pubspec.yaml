name: sylab
description: Sylab AI 助手 - 商用级多智能体AI助手（商业化升级版）
version: 2.0.0+4

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  # 网络核心
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  # 设备信息
  device_info_plus: ^10.1.0
  # 本地持久化
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  # 权限管理
  permission_handler: ^11.3.1
  # UI加载
  flutter_spinkit: ^5.2.0
  # 文件操作
  open_filex: ^4.5.0
  # 日志
  logger: ^2.4.0
  # 防抖动
  easy_debounce: ^2.0.3
  # 修复：官方真实存在docx文档生成库
  docx_creator: ^1.1.2
  # Markdown 渲染
  flutter_markdown: ^0.7.4+3
  markdown: ^7.2.2
  # 代码高亮
  highlight: ^0.7.0
  # UUID 生成
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
