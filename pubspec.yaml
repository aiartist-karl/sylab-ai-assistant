name: sylab
description: 商用级多智能体AI助手 — 扣子UI复刻版
version: 2.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  # 路由
  go_router: ^14.6.2
  # 状态管理
  flutter_riverpod: ^2.6.1
  # 网络核心
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  # 设备信息
  device_info_plus: ^10.1.0
  # 本地持久化
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  # 权限管理
  permission_handler: ^11.3.1
  # UI组件
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.6
  flutter_math_fork: ^0.7.3
  # Markdown增强
  markdown: ^7.2.2
  # 代码高亮
  highlight: ^2.0.0
  flutter_highlight: ^0.7.0
  # WebView (Monaco Editor)
  webview_flutter: ^4.10.0
  # 文件操作
  open_filex: ^4.5.0
  file_picker: ^8.1.7
  # 日志
  logger: ^2.4.0
  # 防抖动
  easy_debounce: ^2.0.3
  # 图片
  image_gallery_saver2_fixed: ^2.0.6
  # 动画
  flutter_animate: ^2.0.1
  # 文档生成
  docx_creator: ^1.1.2
  # JSON序列化
  json_annotation: ^4.9.0
  # 国际化
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    # 扣子UI图片资源（从APK逆向提取）
    - assets/images/coze/
    - assets/images/icons/
    # 动画资源
    - assets/animations/

  # Fonts - Inter will fallback to system fonts
  # To add custom fonts, place .ttf files in assets/fonts/ and uncomment below
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
