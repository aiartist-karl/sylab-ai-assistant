name: sylab
description: 商用级多智能体AI助手 — 扣子UI复刻版
version: 2.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  # 网络核心 (old code)
  dio: ^5.4.0
  # 本地持久化 (old code)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  # 权限管理 (old code)
  permission_handler: ^11.3.0
  # 图片保存 (old code) - REMOVED: no iOS podspec
  # image_gallery_saver2_fixed: ^2.0.6
  # 文档生成 (old code)
  docx_creator: ^1.1.2
  # 日志 (old code)
  logger: ^2.4.0
  # 防抖动 (old code)
  easy_debounce: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    # 扣子UI图片资源（从APK逆向提取）
    - assets/images/coze/
    - assets/images/icons/
    # 动画资源
    - assets/animations/
