name: sylab
description: 商用级多智能体AI助手（全BUG根治终极版）
version: 1.3.0+3

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  # 网络核心
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  # 设备信息
  device_info_plus: ^10.1.0
  # 本地持久化
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  # 权限管理
  permission_handler: ^11.3.1
  # UI加载
  flutter_spinkit: ^5.2.0
  # 文件操作
  open_filex: ^4.5.0
  # 日志
  logger: ^2.4.0
  # 防抖动
  easy_debounce: ^2.0.3
  # 修复：官方稳定可用相册保存库
  image_gallery_saver2_fixed: ^2.0.6
  # 修复：官方真实存在docx文档生成库
  docx_creator: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
