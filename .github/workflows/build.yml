name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Create temp Flutter project and merge source
        run: |
          cd /tmp
          flutter create --org com.sylab --project-name sylab sylab_build --platforms android
          
          cd sylab_build
          
          # 复制源码和配置
          cp -r $GITHUB_WORKSPACE/lib/* lib/
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          
          # 调试：显示 build.gradle 文件
          echo "=== android/app/ build files ==="
          ls -la android/app/build.gradle*
          echo "=== android/ build files ==="
          ls -la android/build.gradle*
          
          # 显示 app 级 build 文件内容
          echo "=== app build.gradle.kts content ==="
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null
          
          # 在 android/build.gradle (项目级别) 末尾添加强制 compileSdk 配置
          # 这会覆盖所有子模块（包括 image_gallery_saver2_fixed）的 compileSdk
          if [ -f "android/build.gradle.kts" ]; then
            cat >> android/build.gradle.kts << 'GRADLE'
          
          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdk = 34
                      }
                  }
              }
          }
          GRADLE
          else
            cat >> android/build.gradle << 'GRADLE'
          
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          GRADLE
          fi
          
          # 安装依赖 + 构建
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: /tmp/sylab_build/build/app/outputs/flutter-apk/app-release.apk
