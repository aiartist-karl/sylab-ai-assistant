name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Create temp Flutter project and merge source
        run: |
          cd /tmp
          flutter create --org com.sylab --project-name sylab sylab_build --platforms android
          
          cd sylab_build
          
          # 复制源码和配置
          cp -r $GITHUB_WORKSPACE/lib/* lib/
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          
          # 设置 app compileSdk = 35
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle.kts
          
          # 安装依赖
          flutter pub get
          
          # 直接修改所有插件包的 compileSdk 为 35
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$PUB_CACHE_DIR" -path "*/android/build.gradle" -type f | while read f; do
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$f"
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/' "$f"
            sed -i 's/flutter.compileSdkVersion/35/' "$f"
          done
          find "$PUB_CACHE_DIR" -path "*/android/build.gradle.kts" -type f | while read f; do
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' "$f"
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/' "$f"
          done
          
          # 生成 Hive 适配器代码
          flutter pub run build_runner build --delete-conflicting-outputs
          
          # 构建 APK
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: /tmp/sylab_build/build/app/outputs/flutter-apk/app-release.apk
