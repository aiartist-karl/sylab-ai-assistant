name: Build iOS & Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Build APK (debug)
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sylab-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios
      
      - name: Install CocoaPods
        working-directory: ./ios
        run: pod install
      
      - name: Build iOS (unsigned)
        working-directory: ./ios
        run: |
          xcodebuild \
            -workspace sylab.xcworkspace \
            -scheme sylab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
      
      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/sylab.app Payload/
          zip -r sylab-unsigned.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sylab-ios-unsigned
          path: sylab-unsigned.ipa
