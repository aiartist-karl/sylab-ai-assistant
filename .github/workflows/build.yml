name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Create temp Flutter project and merge source
        run: |
          cd /tmp
          flutter create --org com.sylab --project-name sylab sylab_build --platforms android
          
          cd sylab_build
          
          # 复制源码和配置
          cp -r $GITHUB_WORKSPACE/lib/* lib/
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          
          # ====== 修复 image_gallery_saver2_fixed lStar 问题 ======
          # 1. 修改 app 的 compileSdk 为 34
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
          
          # 2. 删除 Kotlin DSL 的项目级 build.gradle.kts，替换为 Groovy 格式
          #    Groovy 语法可以更方便地强制子项目 compileSdk
          rm -f android/build.gradle.kts
          cat > android/build.gradle << 'GRADLE'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          
          // 强制所有子模块（包括 image_gallery_saver2_fixed）使用 compileSdk 34
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          GRADLE
          
          # 3. settings.gradle.kts 也需要兼容 Groovy build.gradle
          # Flutter 3.41 可能用 settings.gradle.kts，需要检查
          if [ -f "android/settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
            cat android/settings.gradle.kts
          fi
          if [ -f "android/settings.gradle" ]; then
            echo "Found settings.gradle"
            cat android/settings.gradle
          fi
          
          # 安装依赖 + 构建
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: /tmp/sylab_build/build/app/outputs/flutter-apk/app-release.apk
