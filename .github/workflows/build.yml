name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Create temp Flutter project and merge source
        run: |
          cd /tmp
          flutter create --org com.sylab --project-name sylab sylab_build --platforms android
          
          cd sylab_build
          
          # 复制源码和配置
          cp -r $GITHUB_WORKSPACE/lib/* lib/
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          
          # ===== 修复 1: app compileSdk 设为 35 =====
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle.kts
          
          # ===== 修复 2: 强制所有子模块(插件) compileSdk = 35 =====
          # 在 android/build.gradle.kts 末尾追加 subprojects 块
          cat >> android/build.gradle.kts << 'GRADLE_EOF'
          
          subprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.library")) {
                      extensions.configure<com.android.build.gradle.LibraryExtension>("android") {
                          compileSdk = 35
                      }
                  }
              }
          }
          GRADLE_EOF
          
          echo "=== android/build.gradle.kts ==="
          cat android/build.gradle.kts
          echo "=== android/app/build.gradle.kts (compileSdk line) ==="
          grep -n "compileSdk" android/app/build.gradle.kts
          
          # 安装依赖
          flutter pub get
          
          # 生成 Hive 适配器
          flutter pub run build_runner build --delete-conflicting-outputs
          
          # 构建 APK
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: /tmp/sylab_build/build/app/outputs/flutter-apk/app-release.apk
