name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Create temp Flutter project and merge source
        run: |
          cd /tmp
          flutter create --org com.sylab --project-name sylab sylab_build --platforms android
          
          cd sylab_build
          
          # 复制源码和配置
          cp -r $GITHUB_WORKSPACE/lib/* lib/
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          
          # 查找并修改 build.gradle (Groovy) 或 build.gradle.kts (Kotlin DSL)
          if [ -f "android/app/build.gradle" ]; then
            echo "Found Groovy build.gradle"
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/' android/app/build.gradle
            sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 34/' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Found Kotlin build.gradle.kts"
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts
            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts
          fi
          
          # 显示实际使用的 SDK 版本
          echo "=== build.gradle config ==="
          find android -name "build.gradle*" -exec grep -n "compileSdk\|targetSdk" {} \;
          
          # 安装依赖 + 构建
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: /tmp/sylab_build/build/app/outputs/flutter-apk/app-release.apk
