name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Create temp Flutter project and merge source
        run: |
          cd /tmp
          flutter create --org com.sylab --project-name sylab sylab_build --platforms android
          cd sylab_build
          # 复制我们的源码
          cp -r $GITHUB_WORKSPACE/lib/* lib/
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          # 安装依赖
          flutter pub get
          # 生成 Hive 适配器
          flutter pub run build_runner build --delete-conflicting-outputs
          # 构建 APK
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: /tmp/sylab_build/build/app/outputs/flutter-apk/app-release.apk
