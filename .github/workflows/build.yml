name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Create temp Flutter project and merge source
        run: |
          cd /tmp
          flutter create --org com.sylab --project-name sylab sylab_build --platforms android
          
          cd sylab_build
          
          # 复制源码和配置
          cp -r $GITHUB_WORKSPACE/lib/* lib/
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          
          # 修改 app compileSdk 为 34
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
          
          # 安装依赖
          flutter pub get
          
          # 直接修改 image_gallery_saver2_fixed 包的 compileSdk
          # 找到包在 pub-cache 中的位置
          PKG_DIR=$(find ${PUB_CACHE:-$HOME/.pub-cache} -path "*/image_gallery_saver2_fixed*/android" -type d | head -1)
          echo "Found package at: $PKG_DIR"
          if [ -n "$PKG_DIR" ]; then
            # 强制设置 compileSdkVersion 为 34
            for f in $(find "$PKG_DIR" -name "build.gradle"); do
              echo "Patching: $f"
              sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' "$f"
              sed -i 's/compileSdk.*/compileSdk 34/' "$f"
            done
          fi
          
          # 生成 Hive 适配器
          flutter pub run build_runner build --delete-conflicting-outputs
          
          # 构建 APK
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: /tmp/sylab_build/build/app/outputs/flutter-apk/app-release.apk
