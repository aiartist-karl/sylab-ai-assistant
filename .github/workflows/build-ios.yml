name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Create iOS platform scaffolding
        run: flutter create . --org com.sylab --project-name sylab --platforms ios

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build iOS with xcodebuild (no codesign)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .app into IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r Sylab-iOS-Unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: Sylab-iOS-Unsigned.ipa
          retention-days: 30

      - name: Upload to file.io for direct download
        run: |
          UPLOAD_RESULT=$(curl -s -F "file=@Sylab-iOS-Unsigned.ipa" https://file.io)
          DOWNLOAD_URL=$(echo $UPLOAD_RESULT | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('link','FAILED'))")
          echo "::notice::Download IPA: $DOWNLOAD_URL"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_STEP_SUMMARY
          echo "=== Download Link: $DOWNLOAD_URL ==="
