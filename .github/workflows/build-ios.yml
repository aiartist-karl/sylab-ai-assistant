name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Create temp Flutter project and merge source
        run: |
          cd /tmp
          flutter create --org com.sylab --project-name sylab sylab_build --platforms ios
          
          cd sylab_build
          
          # 复制源码和配置
          cp -r $GITHUB_WORKSPACE/lib/* lib/
          cp $GITHUB_WORKSPACE/pubspec.yaml pubspec.yaml
          
          # 安装依赖
          flutter pub get
          
          # Patch 所有插件包的 compileSdk 为 35
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$PUB_CACHE_DIR" -path "*/android/build.gradle" -type f | while read f; do
            sed -i '' 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$f"
            sed -i '' 's/compileSdk = [0-9]*/compileSdk = 35/' "$f"
            sed -i '' 's/flutter.compileSdkVersion/35/' "$f"
          done
          find "$PUB_CACHE_DIR" -path "*/android/build.gradle.kts" -type f | while read f; do
            sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' "$f"
            sed -i '' 's/compileSdk = [0-9]*/compileSdk = 35/' "$f"
          done
          
          # 移除 Xcode 强制签名要求（支持 --no-codesign）
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' '/DEVELOPMENT_TEAM = /d' "$PBXPROJ"
          sed -i '' '/CODE_SIGN_IDENTITY = /d' "$PBXPROJ"
          sed -i '' '/CODE_SIGN_STYLE = /d' "$PBXPROJ"
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER = /d' "$PBXPROJ"
          
          # 生成 Hive 适配器代码
          flutter pub run build_runner build --delete-conflicting-outputs
          
          # 构建 iOS (不签名)
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          cd /tmp/sylab_build
          
          # 创建 IPA 结构
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          
          # 打包为 IPA
          zip -r SylabAI-v2.0-unsigned.ipa Payload/
          
          echo "IPA size: $(du -h SylabAI-v2.0-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: /tmp/sylab_build/SylabAI-v2.0-unsigned.ipa
