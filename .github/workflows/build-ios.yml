name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Create iOS platform scaffolding
        run: flutter create . --org com.sylab --project-name sylab --platforms ios

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build iOS with xcodebuild (no codesign)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .app into IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r Sylab-iOS-Unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: Sylab-iOS-Unsigned.ipa
          retention-days: 30

      - name: Upload to multiple file hosts
        run: |
          echo "=== Uploading IPA to file hosting services ==="
          
          # Try tmpfiles.org
          echo "Trying tmpfiles.org..."
          TMPFILES_RESULT=$(curl -s -F "file=@Sylab-iOS-Unsigned.ipa" https://tmpfiles.org/api/v1/upload)
          TMPFILES_URL=$(echo "$TMPFILES_RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); u=d.get('data',{}).get('url',''); print(u.replace('/tmpfiles.org/','/tmpfiles.org/dl/')) if u else print('')")
          if [ -n "$TMPFILES_URL" ] && [ "$TMPFILES_URL" != "" ]; then
            echo "tmpfiles.org URL: $TMPFILES_URL"
            echo "DOWNLOAD_URL=$TMPFILES_URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "tmpfiles.org failed, trying 0x0.st..."
            ZEROX_RESULT=$(curl -s -F "file=@Sylab-iOS-Unsigned.ipa" https://0x0.st)
            if [ -n "$ZEROX_RESULT" ]; then
              echo "0x0.st URL: $ZEROX_RESULT"
              echo "DOWNLOAD_URL=$ZEROX_RESULT" >> $GITHUB_STEP_SUMMARY
            else
              echo "All file hosts failed"
            fi
          fi
